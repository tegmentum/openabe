[package]
name = "rabe-abe-fuzz"
version = "0.0.0"
authors = ["Automated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.rabe-abe]
path = ".."
features = ["serde"]

[dependencies.rabe-bls12381]
path = "../../rabe-bls12381"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_decrypt"
path = "fuzz_targets/fuzz_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_policy_parse"
path = "fuzz_targets/fuzz_policy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cbor_decode"
path = "fuzz_targets/fuzz_cbor_decode.rs"
test = false
doc = false
bench = false
