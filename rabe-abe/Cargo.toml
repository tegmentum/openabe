[package]
name = "rabe-abe"
version = "0.1.0"
edition = "2021"
description = "Attribute-Based Encryption schemes using BLS12-381"
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde", "rabe-bls12381/serde"]
wasm = ["rabe-bls12381/wasm", "getrandom/js"]

[[bin]]
name = "rabe-cli"
path = "src/bin/cli.rs"

[dependencies]
rabe-bls12381 = { path = "../rabe-bls12381" }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0"
ciborium = "0.2"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"
getrandom = { version = "0.2", optional = true }

# Symmetric encryption for hybrid scheme
aes-gcm = "0.10"

# Hashing
sha2 = "0.10"
sha3 = "0.10"

# Error handling
thiserror = "1.0"

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
