[package]
name = "rabe-abe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Attribute-Based Encryption schemes using BLS12-381"
keywords = ["cryptography", "abe", "attribute-based-encryption", "bls12-381", "pairing"]
categories = ["cryptography"]

[features]
default = ["serde", "parallel"]
serde = ["dep:serde", "rabe-bls12381/serde"]
wasm = ["rabe-bls12381/wasm", "getrandom/js"]
# Enable optional libc for memory locking (mlock)
memory-protection = ["libc"]
# Enable parallel processing with Rayon
parallel = ["rayon"]

[dependencies]
rabe-bls12381 = { path = "../rabe-bls12381" }

# Serialization
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
ciborium = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_chacha = { workspace = true }
getrandom = { workspace = true }

# Symmetric encryption for hybrid scheme
aes-gcm = { workspace = true }

# Security hardening
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
hkdf = "0.12"

# Optional: memory protection (mlock)
libc = { version = "0.2", optional = true }

# Logging for audit
log = "0.4"

# Performance: LRU cache for hash-to-curve
lru = "0.12"

# Performance: Parallel processing (optional)
rayon = { version = "1.10", optional = true }

# Hashing
sha2 = { workspace = true }
sha3 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Needed for hex encoding in policy attributes
hex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "abe_benchmarks"
harness = false

[[bench]]
name = "pairing_benchmarks"
harness = false
