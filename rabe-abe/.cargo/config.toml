# Cargo configuration for rabe-abe
# Supports both native and WASM Component builds

# Alias for building WASM components
[alias]
wasm = "build --lib --target wasm32-wasip2 --features wasm --no-default-features"
wasm-release = "build --lib --target wasm32-wasip2 --features wasm --no-default-features --release"
wasm-cli = "build --bin rabe-cli --target wasm32-wasip2"
wasm-cli-release = "build --bin rabe-cli --target wasm32-wasip2 --release"

# WASM target configuration
[target.wasm32-wasip2]
# Runner for testing with wasmtime
runner = "wasmtime run --dir=."

[target.wasm32-unknown-unknown]
# No runner for pure WASM (no WASI)

[target.wasm32-wasip1]
runner = "wasmtime run --dir=."
