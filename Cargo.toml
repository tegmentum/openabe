[workspace]
resolver = "2"
members = [
    "rabe-bls12381",
    "rabe-abe",
    "rabe-cli",
]
# Note: rabe-wasm is excluded - it uses wasm-bindgen for browser targets
# The rabe-cli crate supports WASI Component Model (wasm32-wasip2) instead
exclude = ["rabe-wasm"]

# Shared metadata
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zabe-abe/rabe-abe"
keywords = ["cryptography", "abe", "attribute-based-encryption", "bls12-381"]
categories = ["cryptography"]

# Shared dependencies - ensures version consistency across workspace
[workspace.dependencies]
# Arkworks ecosystem
ark-ff = "0.4"
ark-ec = "0.4"
ark-bls12-381 = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"

# Symmetric encryption
aes-gcm = "0.10"

# Hashing
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"

# Error handling
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }

# Profile settings for the entire workspace
[profile.release]
opt-level = 3
lto = "thin"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true
