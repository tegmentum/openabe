[package]
name = "rabe-wasm"
version = "0.2.0"
edition = "2021"
description = "WASM-bindgen bindings for browser-based ABE (BLS12-381)"
license = "MIT OR Apache-2.0"
# Note: This crate provides wasm-bindgen bindings for browser WASM.
# For WASI Component Model (wasmtime, etc.), use rabe-cli instead.

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rabe-wasm-cli"
path = "src/main.rs"

[features]
default = ["console_error_panic_hook"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook", "getrandom/js", "rabe-bls12381/wasm", "rabe-abe/wasm"]

[dependencies]
# Local BLS12-381 ABE libraries
rabe-bls12381 = { path = "../rabe-bls12381" }
rabe-abe = { path = "../rabe-abe" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
thiserror = "1.0"

# Random
rand = "0.8"

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
