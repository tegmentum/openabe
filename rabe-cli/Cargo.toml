[package]
name = "rabe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Attribute-Based Encryption"
keywords = ["cryptography", "abe", "cli", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "rabe"
path = "src/main.rs"

[features]
default = []
wasm = ["rabe-abe/wasm", "getrandom/js"]

[dependencies]
rabe-abe = { path = "../rabe-abe" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Random
rand = { workspace = true }

# CLI
clap = { workspace = true }

# WASM support
getrandom = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
