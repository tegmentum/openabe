[package]
name = "rabe-bls12381"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BLS12-381 pairing library - drop-in replacement for rabe-bn"
keywords = ["cryptography", "bls12-381", "pairing", "elliptic-curves"]
categories = ["cryptography"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["serde"]
serde = ["dep:serde", "ark-serialize/derive"]
borsh = ["dep:borsh"]
wasm = ["getrandom/js"]
ffi = []  # Enable C FFI bindings

[dependencies]
# Arkworks ecosystem for BLS12-381
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }

# Serialization
serde = { workspace = true, optional = true }
borsh = { version = "1.0", optional = true }

# Random number generation
rand = { workspace = true }
getrandom = { workspace = true, optional = true }

# For hash-to-curve
sha2 = { workspace = true }
digest = { workspace = true }

# For thread-safe global state in FFI
once_cell = "1.18"
